[project]
name = "diskhog"
version = "0.1.0"
description = "Find and delete disk space hogs: an interactive tree of directory and file sizes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "textual>=1.0,<4",
    "send2trash>=1.8.2",
]

[project.scripts]
diskhog = "diskhog.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diskhog"]
